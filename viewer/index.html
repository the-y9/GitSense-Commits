<head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
 <!-- Import Poppins font (add this in your HTML head)  -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <script>
    marked.setOptions({
      highlight: function(code, lang) {
        const validLang = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language: validLang }).value;
      }
    });
  </script>


</head>
<body>

<h1>GitSense Daily Summary Viewer</h1>

<div style="text-align:center;">
  <input type="text" id="datePicker" placeholder="Select date for the summary" aria-label="Select date for the summary" />

  <button onclick="loadSummary()" aria-label="Load summary">Load Summary</button>
</div>

<div id="summary">
  <div class="loading">Please select a date or load the latest summary.</div>
</div>



  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
